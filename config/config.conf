# ============================================================
# Security Assessment Configuration
# ============================================================
# Every variable below can be overridden by exporting an
# environment variable with the same name before running a module.
# Values are plain literals (no shell expansion).

# --- Phase 1/2 : Nmap ---
NMAP_TIMING="-T4"
NMAP_PORTS="-p-"
NMAP_SERVICE_DETECTION="-sV"
# Safe default NSE category. 'vuln' is opt-in (not enabled by default) and
# exploitation is always a separate, approval-gated phase.
NMAP_SCRIPTS="default"
NMAP_OUTPUT_FORMAT="xml"

# --- Phase 2 : Enumeration V2 (multi-stage) ---
# Stage-1 port selection mode:
#   top    = top-N most common TCP ports (default; N = ENUM_TOP_PORTS)
#   all    = all 65535 TCP ports
#   custom = use NMAP_PORTS (-p <list/range>)
# Note: an explicitly exported NMAP_PORTS is always honored as 'custom'.
ENUM_PORT_MODE="top"
ENUM_TOP_PORTS="100"
# Bounded timeouts per stage (seconds). A timeout is recorded, never success.
ENUM_DISCOVERY_TIMEOUT="300"
ENUM_SERVICE_TIMEOUT="600"
ENUM_HANDLER_TIMEOUT="30"

# --- Phase 3 : Vulnerability Research ---
# Set to "false" to skip SearchSploit lookups.
SEARCHSPLOIT_ENABLED="true"

# --- Phase 5 : Exploitation (authorized Metasploitable 2 lab only) ---
# Set to "false" to hard-disable exploitation.
METASPLOIT_ENABLED="true"
# Never auto-run every candidate.
AUTO_EXPLOIT="false"
# Require explicit interactive confirmation before running an exploit.
REQUIRE_EXPLOIT_APPROVAL="true"

# --- Phase 7 : Reporting ---
# Comma separated: "md" and/or "html".
REPORT_FORMAT="md,html"
REPORT_TITLE="Metasploitable 2 Security Assessment"

# --- Scope / Incremental Assessment (Phases 10-11) ---
# Upper bound on how many hosts a single CIDR may expand to. Refuses
# anything larger (resource control - this is not a DoS tool).
SCOPE_MAX_EXPANDED_TARGETS="256"
# Bounded parallel enumeration worker count for multi-target scope scans.
# 1 = fully sequential. Conservative by default; never unlimited.
ENUMERATION_WORKERS="2"
# Per-target worker timeout (seconds). A timed-out target is recorded as
# failed (reason=timeout), never as success.
SCOPE_TARGET_TIMEOUT="300"